<body>
<main class="workshop">
  <header class="studio-head"><div class="wordmark"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><strong>QA Decision Desk</strong><p class="edition">VISUAL DIRECTION / 01—03</p></div></div><button class="language" id="language" aria-label="Switch language">EN / 中</button></header>
  <div class="intro"><div><h1 id="headline"></h1><p id="subtitle"></p></div><span class="prototype-tag">LOCAL PROTOTYPE · NOT LIVE</span></div>
  <div class="controls"><nav class="views" aria-label="Sample layout"><button data-view="a" aria-pressed="true"></button><button data-view="b" aria-pressed="false"></button><button data-view="c" aria-pressed="false"></button></nav><div class="dataset" role="group" aria-label="Sample dataset"><button data-set="current" aria-pressed="true"></button><button data-set="demo" aria-pressed="false"></button></div></div>
  <section id="preview" class="preview" aria-label="Dashboard sample"></section>
  <div class="hint"><span id="design-note"></span><span id="interaction-note"></span></div>
  <div class="legend" id="legend"></div>
</main>
<dialog id="details" aria-labelledby="detail-title"><div id="detail-content"></div><button class="close" id="close"></button></dialog>
<script>
const copy={zh:{headline:'先看狀態，再看細節。',subtitle:'三種閱讀方式，相同資料。點選切換，比較第一眼。',views:['A · 狀態卡','B · 燈號矩陣','C · 決策看板'],current:'現況快照',demo:'模擬情境',source:'現況快照 · 2026-09-06 擷取，非即時',demoSource:'模擬資料 · 所有名稱與狀態均為設計示範',titles:['目前發布狀態','Release signal board','先處理哪些？'],notes:['推薦 A：狀態最大、原因最短，適合目前少量 Repo。','B：適合同時比較多個 Repo；手機表格可左右滑動。','C：需要追蹤處理進度時，依決定分組最直覺。'],interact:'點狀態篩選 · 點「細節」展開',simpleInteract:'點「細節」展開',ready:'可發布',risk:'有風險',blocked:'不可發布',unknown:'待確認',details:'細節 ↗',close:'關閉',last:'最後測試',snapshot:'來源快照',owner:'負責人',next:'下一步',noItems:'此狀態目前沒有項目',all:'顯示全部',filtered:'已篩選',release:'發布判定',test:'測試',evidence:'證據',review:'審查',repo:'REPOSITORY',pass:'通過',fail:'失敗',valid:'有效',expired:'過期',pending:'待補',approved:'核准',caution:'風險',attention:'個需要關注',total:'個 Repo',available:'個可發布',matrixNote:'各欄為不同判斷；歷史測試通過，不等於目前可發布。',boardNote:'只依狀態分組，沒有拖曳核准功能。',boundary:'待確認 ≠ 測試失敗',demoDate:'示範',frozen:'這是設計用快照，不會同步或核准任何產品。',demoDetail:'這筆為合成設計資料，不是真實執行或發布核准。'},en:{headline:'Status first. Details second.',subtitle:'Three reading patterns. The same data. Compare at a glance.',views:['A · Status cards','B · Signal matrix','C · Decision board'],current:'Current snapshot',demo:'Demo scenarios',source:'Snapshot captured 2026-09-06 · Not live',demoSource:'SYNTHETIC DATA · Names and statuses are design examples',titles:['Release overview','Release signal board','What needs attention?'],notes:['Recommended A: large verdicts, short reasons. Best for a small portfolio.','B: compare more repos at once. Swipe the table on mobile.','C: group by decision when follow-up work matters most.'],interact:'Filter by status · Open details',simpleInteract:'Open details for evidence',ready:'Ready',risk:'At risk',blocked:'No-Go',unknown:'Unknown',details:'Details ↗',close:'Close',last:'Last test',snapshot:'Snapshot',owner:'Owner',next:'Next action',noItems:'No items in this state',all:'Show all',filtered:'Filtered',release:'DECISION',test:'TESTS',evidence:'EVIDENCE',review:'REVIEW',repo:'REPOSITORY',pass:'Pass',fail:'Fail',valid:'Valid',expired:'Expired',pending:'Pending',approved:'Approved',caution:'Risk',attention:'need attention',total:'repos',available:'ready to release',matrixNote:'Separate signals: historical passing tests do not imply current release approval.',boardNote:'Grouped by decision. Drag-to-approve is intentionally unavailable.',boundary:'Unknown ≠ failed tests',demoDate:'Demo',frozen:'Frozen design snapshot. This page cannot sync or authorize a release.',demoDetail:'Synthetic design data, not an actual execution or release approval.'}};
const current=[{id:'cex',name:'CEX Market Data',repo:'cex-market-data-quality-lab',status:'unknown',date:'2026-08-17',test:'pass',evidence:'expired',review:'pending',reason:{zh:'證據已過期',en:'Evidence expired'},action:{zh:'取得新證據並完成審查',en:'Collect fresh evidence and complete review'},sha:'8fd5081',owner:'William'},{id:'portfolio',name:'Portfolio',repo:'sanyoii.github.io',status:'unknown',date:'2026-08-19',test:'pass',evidence:'expired',review:'pending',reason:{zh:'證據已過期',en:'Evidence expired'},action:{zh:'取得新證據並完成審查',en:'Collect fresh evidence and complete review'},sha:'fd337bd',owner:'William'}];
const demo=[{id:'payments',name:'Payments API',repo:'demo / payments-api',status:'ready',test:'pass',evidence:'valid',review:'approved',reason:{zh:'證據與核准齊全',en:'Evidence and approval complete'},action:{zh:'僅為可發布狀態的視覺示範',en:'Visual example of a ready decision only'}},{id:'wallet',name:'Wallet UI',repo:'demo / wallet-ui',status:'risk',test:'pass',evidence:'valid',review:'caution',reason:{zh:'仍有已知風險',en:'Known risk remains'},action:{zh:'審查剩餘風險',en:'Review remaining risk'}},{id:'ledger',name:'Ledger Core',repo:'demo / ledger-core',status:'blocked',test:'fail',evidence:'valid',review:'pending',reason:{zh:'必要案例失敗',en:'Required case failed'},action:{zh:'修正並重新執行必要案例',en:'Fix and rerun the required case'}},{id:'market',name:'Market Feed',repo:'demo / market-feed',status:'unknown',test:'pass',evidence:'expired',review:'pending',reason:{zh:'缺少有效證據',en:'Current evidence missing'},action:{zh:'取得有效證據',en:'Collect current evidence'}}];
const states=['ready','risk','blocked','unknown'];const glyph={ready:'✓',risk:'!',blocked:'×',unknown:'?'};const query=new URLSearchParams(location.search);let lang=query.get('lang')==='en'?'en':'zh',view=['a','b','c'].includes(query.get('view'))?query.get('view'):'a',dataset=query.get('data')==='demo'?'demo':'current',filter=null;const $=s=>document.querySelector(s);const tr=()=>copy[lang];const rows=()=>dataset==='demo'?demo:current;
function detailButton(r){return `<button class="detail-button" data-open="${r.id}" aria-label="${tr().details} ${r.name}">${tr().details}</button>`}
function date(r){return r.date||tr().demoDate}
function summary(){return `<div class="summary-strip">${states.map(s=>`<button class="summary-cell ${s}" data-filter="${s}" aria-pressed="${filter===s}" aria-label="${tr()[s]} ${rows().filter(r=>r.status===s).length}"><span><i class="dot" aria-hidden="true"></i>${tr()[s]}</span><strong>${rows().filter(r=>r.status===s).length}</strong></button>`).join('')}</div>`}
function card(r){return `<article class="status-card ${r.status}"><div class="card-content"><div class="card-top"><div><h3 class="repo-name">${r.name}</h3><p class="repo-caption">${r.repo}</p></div><span class="tiny-id">${r.sha||'DEMO'}</span></div><div class="state-body"><span class="state-icon" aria-hidden="true">${glyph[r.status]}</span><div class="state-copy"><strong>${tr()[r.status]}</strong><p>${r.reason[lang]}</p></div></div><div class="card-bottom"><span>${tr().last} · ${date(r)}</span>${detailButton(r)}</div></div></article>`}
function signal(value){const tone={pass:'ready',valid:'ready',approved:'ready',fail:'blocked',expired:'unknown',pending:'unknown',caution:'risk'}[value];return `<span class="signal ${tone}"><i aria-hidden="true">${glyph[tone]}</i>${tr()[value]}</span>`}
function matrix(){let ready=rows().filter(r=>r.status==='ready').length;return `<div class="matrix-overview"><b>${ready}<span style="font-size:25px;letter-spacing:0;color:#9caf9f"> / ${rows().length}</span></b><div><strong>${tr().available}</strong><p>${rows().length-ready} ${tr().attention}</p><div class="distribution" aria-hidden="true">${rows().map(r=>`<i class="${r.status}"></i>`).join('')}</div></div></div><div class="matrix-wrap" tabindex="0" role="region" aria-label="${tr().views[1]}"><table class="matrix"><thead><tr><th scope="col">${tr().repo}</th><th scope="col">${tr().test}</th><th scope="col">${tr().evidence}</th><th scope="col">${tr().review}</th><th scope="col">${tr().release}</th><th scope="col">${tr().details}</th></tr></thead><tbody>${rows().map(r=>`<tr><td><h3 class="repo-name">${r.name}</h3><p class="repo-caption">${tr().last} · ${date(r)}</p></td><td>${signal(r.test)}</td><td>${signal(r.evidence)}</td><td>${signal(r.review)}</td><td><span class="badge ${r.status}"><span aria-hidden="true">${glyph[r.status]}</span>${tr()[r.status]}</span></td><td>${detailButton(r)}</td></tr>`).join('')}</tbody></table></div><p class="matrix-footer">${tr().matrixNote}</p>`}
function board(){return `<div class="board-headline"><strong>${rows().filter(r=>r.status!=='ready').length}</strong><span>${tr().attention}</span></div><div class="board">${['unknown','blocked','risk','ready'].map(s=>{const list=rows().filter(r=>r.status===s);return `<section class="lane ${s}" aria-label="${tr()[s]}"><div class="lane-title"><strong><span aria-hidden="true">${glyph[s]}</span>${tr()[s]}</strong><b>${list.length}</b></div>${list.length?list.map(r=>`<article class="ticket"><h3 class="repo-name">${r.name}</h3><p class="reason">${r.reason[lang]}</p><div class="ticket-foot"><span>${date(r)}</span>${detailButton(r)}</div></article>`).join(''):`<div class="lane-empty">${tr().noItems}</div>`}</section>`}).join('')}</div><p class="board-note">${tr().boardNote}</p>`}
function render(){const t=tr(),i=['a','b','c'].indexOf(view);document.documentElement.lang=lang==='zh'?'zh-Hant':'en';document.title=lang==='zh'?'QA 決策台 · 視覺樣本':'QA Decision Desk · Visual samples';$('#headline').textContent=t.headline;$('#subtitle').textContent=t.subtitle;$('#language').textContent=lang==='zh'?'EN / 中':'EN / 中';$('#language').setAttribute('aria-label',lang==='zh'?'切換為英文':'Switch to Chinese');document.querySelectorAll('[data-view]').forEach((b,n)=>{b.textContent=t.views[n];b.setAttribute('aria-pressed',b.dataset.view===view)});document.querySelectorAll('[data-set]').forEach(b=>{b.textContent=t[b.dataset.set];b.setAttribute('aria-pressed',b.dataset.set===dataset)});$('#preview').className='preview'+(view==='b'?' matrix-shell':'');const list=rows().filter(r=>!filter||r.status===filter);$('#preview').innerHTML=`<div class="inside"><div class="preview-head"><div><p class="kicker">${view.toUpperCase()} / QA DECISION DESK</p><h2>${t.titles[i]}</h2></div><span class="source-tag ${dataset==='demo'?'demo':''}">${dataset==='demo'?t.demoSource:t.source}</span></div>${view==='a'?summary()+(filter?`<div class="filter-note">${t.filtered}: ${t[filter]} <button data-clear>${t.all}</button></div>`:'')+`<div class="cards">${list.map(card).join('')}</div>`+(!list.length?`<p class="empty">${t.noItems}</p>`:''):view==='b'?matrix():board()}</div>`;$('#design-note').innerHTML=`<strong>${t.notes[i]}</strong>`;$('#interaction-note').textContent=view==='a'?t.interact:t.simpleInteract;$('#legend').innerHTML=states.map(s=>`<span class="${s}"><i class="dot" aria-hidden="true"></i>${t[s]}</span>`).join('')+`<span>${t.boundary}</span>`;$('#close').textContent=t.close;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;filter=null;render()}else if(b.dataset.set){dataset=b.dataset.set;filter=null;render()}else if(b.dataset.filter){filter=filter===b.dataset.filter?null:b.dataset.filter;render()}else if(b.hasAttribute('data-clear')){filter=null;render()}else if(b.dataset.open){const r=rows().find(r=>r.id===b.dataset.open);$('#detail-content').innerHTML=`<p class="kicker">${dataset==='demo'?tr().demoSource:tr().source}</p><h2 id="detail-title">${r.name}</h2><p class="${r.status}"><strong>${glyph[r.status]} ${tr()[r.status]}</strong> · ${r.reason[lang]}</p><dl><dt>${tr().last}</dt><dd>${date(r)}</dd><dt>${tr().owner}</dt><dd>${r.owner||tr().demoDate}</dd><dt>${tr().next}</dt><dd>${r.action[lang]}</dd>${r.sha?`<dt>${tr().snapshot}</dt><dd>${r.repo} · ${r.sha}</dd>`:''}</dl><p>${dataset==='demo'?tr().demoDetail:tr().frozen}</p>`;$('#details').showModal()}else if(b.id==='language'){lang=lang==='zh'?'en':'zh';render()}else if(b.id==='close')$('#details').close()});
render();
</script>
</body>
</html>
